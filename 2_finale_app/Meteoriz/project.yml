name: Meteoriz
options:
  bundleIdPrefix: ch.beuckmann
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  Meteoriz:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources/Web
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.beuckmann.meteoriz
        PRODUCT_NAME: Meteoriz
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T74MS2C433
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Meteoriz
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: "Meteoriz verwendet deinen Standort, um dir die aktuelle Temperatur und Wetterprognose für genau deinen Standort anzuzeigen. Ohne Freigabe zeigt die App ersatzweise die Station mit der höchsten Tagestemperatur in der Schweiz."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  Meteoriz:
    build:
      targets:
        Meteoriz: all
    run:
      config: Debug
    archive:
      config: Release
