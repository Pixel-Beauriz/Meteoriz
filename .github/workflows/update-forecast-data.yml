name: Update forecast data

on:
  schedule:
    # 20 nach jeder vollen Stunde – etwas Vorlauf, damit MeteoSchweiz den
    # neuen Prognoselauf sicher fertig veröffentlicht hat.
    - cron: '20 * * * *'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build forecast data
        run: python3 scripts/build_forecast_data.py

      - name: Publish to data branch
        run: |
          cd data
          git init -q
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update forecast data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data
